<!doctype html><html><head><meta charset="utf-8"><title>Tactile browser check</title><link rel="stylesheet" href="../docs/style.css"></head><body>
<script type="module">
import { ids } from '../docs/pressure.js';
const page = new DOMParser().parseFromString(await (await fetch('../docs/index.html')).text(), 'text/html');
page.querySelector('script').remove();
document.body.append(...page.body.childNodes);
const note = document.createElement('div'); note.id = 'testResult'; note.style = 'padding:12px;background:#294560;color:white';
note.textContent = 'BROWSER TEST · simulated Bluetooth devices; real application and audio';
document.querySelector('main').prepend(note);
let generation = 0;
let duty = 0, commands = 0, sequence = 0, streaming = false, counts = [0,0,0,0], wave = false, hold = [0,10,20,30];
const encode = text => new DataView(new TextEncoder().encode(text).buffer);
const motorView = () => {
 const view = new DataView(new ArrayBuffer(16));
 view.setUint32(0,sequence,true); view.setUint32(8,commands,true); view.setUint16(12,duty,true); view.setUint16(14,12,true); return view;
};
class Characteristic extends EventTarget {
 constructor(id) { super(); this.id = id; }
 async startNotifications() { return this; }
 async readValue() {
  return this.id === ids.motorStatus ? motorView() : encode(JSON.stringify({generation,streaming,demo:true,message:'Test stream',interval:12}));
 }
 async writeValueWithResponse(value) {
  // Deliver a packet from the previous stream after the new start has completed.
  const old = new DataView(new ArrayBuffer(76));
  for (let i=0;i<4;++i) {
   const o=i*19;old.setUint8(o,1);old.setUint8(o+1,i);old.setUint8(o+2,1);old.setUint8(o+3,1 | generation << 2);
   old.setUint32(o+4,999999,true);
   for(let b=0;b<3;++b)old.setUint8(o+16+b,(240*64000)>>(8*b));
  }
  setTimeout(()=>chars.get(ids.pressure).emit(old),300);
  const command = new TextDecoder().decode(value); streaming = command !== 'X'; counts = [0,0,0,0]; ++generation; emitted=0;
 }
 async writeValueWithoutResponse(value) {
  duty = value.getUint16(0,true); sequence = value.getUint32(2,true); ++commands;
 }
 emit(value) { this.value = value; this.dispatchEvent(new Event('characteristicvaluechanged')); }
}
const chars = new Map(Object.values(ids).map(id => [id,new Characteristic(id)]));
class Device extends EventTarget {
 constructor() { super(); this.gatt = {connected:false,
  connect:async () => {this.gatt.connected=true;return {getPrimaryService:async () => ({getCharacteristic:async id => chars.get(id)})};},
  disconnect:() => {this.gatt.connected=false;this.dispatchEvent(new Event('gattserverdisconnected'));}}; }
}
const sensor = new Device(), motor = new Device();
Object.defineProperty(navigator,'bluetooth',{value:{requestDevice:async options => options.filters[0].services[0] === ids.sensor ? sensor : motor}});
await import('../docs/app.js');
let emitted = 0;
setInterval(() => {
 if (streaming && sensor.gatt.connected) {
  const view = new DataView(new ArrayBuffer(76));
  for (let i=0;i<4;++i) {
   const o=i*19;view.setUint8(o,1);view.setUint8(o+1,i);view.setUint8(o+2,1);view.setUint8(o+3,1 | generation << 2);
   view.setUint32(o+4,counts[i]++,true); view.setUint32(o+8,performance.now()*1000,true);
   const p=100+(emitted<130?0:wave?15*(1-Math.cos(performance.now()/400+i)):hold[i]);
   const raw=Math.round(p*64000);for(let b=0;b<3;++b)view.setUint8(o+16+b,raw>>(8*b));
  }
  chars.get(ids.pressure).emit(view);++emitted;
 }
 chars.get(ids.motorStatus).emit(motorView());
},2);
const get = id => document.getElementById(id);
const wait = ms => new Promise(resolve=>setTimeout(resolve,ms));
const assert = (condition,text) => {if(!condition)throw Error(text);};
const button = document.createElement('button');button.textContent='Run browser check';button.id='runCheck';note.append(button);
button.onclick=async()=>{
 try {
  get('sensorConnect').click();await wait(800);get('motorConnect').click();await wait(100);
  assert(!get('zero').disabled,'Zero enabled');
  assert(get('p3').textContent==='30.00 kPa','Shared 30 kPa displayed');
  const heatColors=()=>[...Array(4)].map((_,i)=>get(`p${i}`).parentElement.style.backgroundColor);
  assert(get('heatState').textContent==='Live','Heatmap receives live shared pressures');
  assert(new Set(heatColors()).size===4,'Four pressure levels have distinct heatmap colors');
  assert(get('stats').textContent.includes('0 gaps · 0 faults'),'Old stream packets rejected');
  get('haptic').click();await wait(80);assert(duty===1023,'Highest pressure drives 100%');
  get('sound').click();await wait(300);assert(get('sound').textContent==='Stop sound','Real audio starts');
  for(let mode=0;mode<5;++mode){get('mode').selectedIndex=mode;get('mode').dispatchEvent(new Event('change'));await wait(50);if(mode===1)assert(get('soundInfo').textContent.includes('continuous vowels'),'Vowels sustain continuously');if(mode===4)assert(get('soundInfo').textContent.includes('pure sine tones'),'Pure tones mapping available');}
  get('zero').click();await wait(50);
  assert([...Array(4)].every((_,i)=>get(`p${i}`).textContent==='0.00 kPa'),'Zero shared pressures');
  assert(duty===205,'Zero motor maps to 20%');
  assert(new Set(heatColors()).size===1,'Zero resets every heatmap cell');
  const zeroColor=heatColors()[0];
  hold=[5,15,25,35];await wait(50);assert(get('p0').textContent==='5.00 kPa','Immediate pressure step after zero');
  assert(new Set(heatColors()).size===1&&heatColors()[0]!==zeroColor,'Heatmap responds to the same unsmoothed step');
  const bad=new DataView(new ArrayBuffer(19));bad.setUint8(0,1);bad.setUint8(2,1);bad.setUint8(3,1 | generation << 2);
  bad.setUint32(4,counts[0],true);for(let i=16;i<19;++i)bad.setUint8(i,255);
  chars.get(ids.pressure).emit(bad);await wait(50);
  assert(duty===0,'Invalid sensor word stops haptics');
  assert(get('p0').textContent==='5.00 kPa','Invalid pressure never reaches shared outputs');
  assert(get('error').textContent.includes('Invalid sensor pressure'),'Acquisition failure visible');
  get('haptic').click();await wait(50);
  get('haptic').click();await wait(50);assert(duty===0,'Stop immediate');
  get('sound').click();streaming=false;await wait(150);assert(get('haptic').disabled,'Stale pressure disables haptics');
  assert(get('heatState').textContent==='Stale','Heatmap marks stale data');
  get('restart').click();await wait(300);wave=true;
  note.firstChild.textContent='PASS · shared zero / heatmap / continuous vowels / pure tones / max-pressure PWM / all audio modes / invalid sensor word / stop / stale input. Simulated BLE devices.';
 } catch(e) {note.firstChild.textContent='FAIL: '+e.message;throw e;}
};
</script></body></html>
